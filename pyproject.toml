[project]
name = "linearrag"
version = "0.1.0"
description = "LinearRAG refactored with LangChain, Elasticsearch, and an abstract knowledge graph."
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
    "elasticsearch>=8.17.2,<9",
    "langchain-core>=0.3.79,<0.4",
    "langchain-openai>=0.3.35,<0.4",
    "loguru>=0.7.3,<0.8",
    "numpy>=1.26,<3",
    "python-dotenv>=1.1.1,<2",
    "python-igraph>=0.11.8,<0.12",
    "spacy>=3.8,<4",
    "tqdm>=4.67.1,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
